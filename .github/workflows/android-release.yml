name: Android Release APK

on:
  workflow_call:
    inputs:
      install_target:
        description: Android package identity (test or production)
        type: string
        required: false
        default: test

jobs:
  build-android:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool file

      - name: Install latest SDL
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          if [ ! -d "SDL2-2.28.5" ]; then
            wget https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz
            tar -xzf SDL2-2.28.5.tar.gz
          fi
          cd SDL2-2.28.5
          ./configure --enable-hidapi-libusb
          make -j 10
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/

      - name: Install latest tinyxml2
        run: |
          sudo apt-get remove -y libtinyxml2-dev
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          if [ ! -d "tinyxml2-10.0.0" ]; then
            wget https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
            tar -xzf 10.0.0.tar.gz
          fi
          cd tinyxml2-10.0.0
          mkdir -p build
          cd build
          cmake ..
          make
          sudo make install

      # Reuse the same 2ship.o2r generated for desktop builds in main.yml.
      - name: Download bundled support archive
        uses: actions/download-artifact@v8
        with:
          name: 2ship.o2r
          path: Android/app/src/main/assets

      - name: Verify bundled support archive
        run: test -s Android/app/src/main/assets/2ship.o2r

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.0.10792818" "cmake;3.30.3"

      - name: Install Android vcpkg dependencies
        env:
          VCPKG_ROOT: ${{ github.workspace }}/build/vcpkg
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.0.10792818"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          mkdir -p build
          if [ ! -d "$VCPKG_ROOT" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT" --depth 1
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-android zlib libpng libogg libvorbis opus opusfile

      - name: Validate package identity and production ref
        env:
          INSTALL_TARGET: ${{ inputs.install_target }}
        run: |
          if [[ "$INSTALL_TARGET" != 'test' && "$INSTALL_TARGET" != 'production' ]]; then
            echo "::error::install_target must be test or production"
            exit 1
          fi
          if [[ "$INSTALL_TARGET" == 'production' && "$GITHUB_REF" != refs/tags/*-pal11-v* ]]; then
            echo "::error::Production Android APK requires a *-pal11-v* tag"
            exit 1
          fi

      - name: Prepare release signing key
        if: inputs.install_target == 'production'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Production APK requires ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release signing is partially configured. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > Android/app/release-keystore.jks

      - name: Build release APK
        working-directory: Android
        env:
          VCPKG_ROOT: ${{ github.workspace }}/build/vcpkg
          ANDROID_KEYSTORE_PATH: ${{ inputs.install_target == 'production' && 'release-keystore.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ inputs.install_target == 'production' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ inputs.install_target == 'production' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ inputs.install_target == 'production' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          app_id_args=()
          if [[ '${{ inputs.install_target }}' == 'test' ]]; then
            app_id_args+=('-PtwoShipApplicationId=com.twoshipfork.mm.touchcontroltest')
          fi
          ./gradlew :app:assembleRelease "${app_id_args[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: 2Ship-Android-${{ inputs.install_target }}
          path: Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
